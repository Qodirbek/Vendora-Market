<!DOCTYPE html>
<html>

<head>

<title>
Admin Login
</title>

<style>

body{
background:#f1f5f9;
font-family:Arial;
}


.box{

width:350px;
background:white;
padding:30px;
margin:120px auto;
border-radius:20px;
box-shadow:0 10px 30px #0002;

}


input{

width:100%;
padding:14px;
margin:10px 0;
border-radius:10px;
border:1px solid #ddd;

}


button{

width:100%;
padding:14px;
background:#2563eb;
color:white;
border:0;
border-radius:10px;
font-size:16px;

}

</style>

</head>


<body>


<div class="box">

<h2>
🔐 Admin kirish
</h2>


<form method="POST">


<input 
name="username"
placeholder="Username">


<input 
name="password"
type="password"
placeholder="Password">


<button>
Kirish
</button>


</form>


</div>


</body>

</html>
