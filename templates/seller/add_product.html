{% extends "seller/base.html" %}

{% block content %}

<div class="page-header">

    <div>
        <h1>
            ➕ Yangi mahsulot qo'shish
        </h1>

        <p>
            Mahsulotingizni kiriting va admin tasdiqlashini kuting
        </p>
    </div>

</div>



<div class="product-form-card">


<form 
method="POST"
enctype="multipart/form-data"
>


<!-- PRODUCT NAME -->

<div class="form-group">

<label>
📦 Mahsulot nomi
</label>

<input
type="text"
name="name"
placeholder="Masalan: Redmi Buds 5"
required
>

</div>



<!-- BRAND -->

<div class="form-group">

<label>
🏷 Brend
</label>

<input
type="text"
name="brand"
placeholder="Apple, Xiaomi..."
>

</div>



<!-- SKU -->

<div class="form-group">

<label>
🔖 SKU kodi
</label>

<input
type="text"
name="sku"
placeholder="ABC-12345"
>

</div>



<!-- PRICE -->

<div class="form-row">


<div class="form-group">

<label>
💰 Narx
</label>

<input
type="number"
name="price"
placeholder="100000"
required
>


</div>



<div class="form-group">

<label>
📦 Ombor soni
</label>

<input
type="number"
name="stock"
placeholder="10"
required
>


</div>


</div>





<!-- IMAGE -->

<div class="form-group">

<label>
🖼 Mahsulot rasmi
</label>


<div class="image-upload">


<input
type="file"
id="image"
name="image"
accept="image/*"
onchange="previewImage(event)"
>


<label for="image"
class="upload-box"
>

<span>
📷
</span>

Rasm tanlash

</label>


<img
id="preview"
class="image-preview"
>


</div>


</div>





<!-- DESCRIPTION -->

<div class="form-group">


<label>
📝 Tavsif
</label>


<textarea

name="description"

rows="6"

placeholder="
Mahsulot haqida batafsil yozing...
">

</textarea>


</div>





<!-- BUTTONS -->


<div class="form-actions">


<a 
href="/seller/products"
class="cancel-btn"
>

❌ Bekor qilish

</a>



<button
type="submit"
class="save-btn"
>

✅ Saqlash

</button>


</div>


</form>


</div>






<script>


function previewImage(event){

let image =
document.getElementById(
"preview"
);


image.src =
URL.createObjectURL(
event.target.files[0]
);


image.style.display="block";

}


</script>



{% endblock %}
